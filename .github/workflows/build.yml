name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы публиковать APK в релиз

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Gera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gera-apk
          path: Gera.apk

      # Свежий APK всегда лежит по одной ссылке: Releases -> latest -> Gera.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Gera.apk \
            --title "Гера (последняя сборка)" \
            --notes "Сборка из коммита ${GITHUB_SHA::7}. Скачайте Gera.apk и установите."
